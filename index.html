<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Spell Generator</title>
    <style>
        :root{
            --pastal-pink: rgb(252, 186, 197);
            --pastal-blue: rgb(134, 134, 253);
            --pastal-green: rgb(146, 246, 146);
            --pastal-purple: rgb(160, 104, 160);
            --pastal-yellow: rgb(250, 250, 151);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top left, rgba(250, 250, 151, 0.95), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(134, 134, 253, 0.9), transparent 35%),
                        linear-gradient(135deg, var(--pastal-pink), var(--pastal-blue));
            color: #2a2140;
        }

        .container {
            width: min(92vw, 720px);
            padding: 2rem;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 24px 60px rgba(66, 38, 114, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 1.25rem;
            color: var(--pastal-purple);
            text-align: center;
            letter-spacing: 0.04em;
        }

        #ingredientsList {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            gap: 0.9rem;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        }

        #ingredientsList li {
            background: linear-gradient(135deg, var(--pastal-blue), var(--pastal-green));
            color: #221f2f;
            padding: 1rem 1.1rem;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(92, 79, 206, 0.18);
            text-align: center;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1.5rem 0;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 0.95rem 1.6rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
            box-shadow: 0 14px 30px rgba(60, 47, 128, 0.12);
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.02);
        }

        #generateButton {
            background: linear-gradient(135deg, var(--pastal-purple), var(--pastal-blue));
            color: white;
        }

        #resetButton {
            background: linear-gradient(135deg, var(--pastal-green), var(--pastal-yellow));
            color: #2a2140;
        }

        #spellArea {
            min-height: 130px;
            display: grid;
            place-items: center;
            padding: 1.4rem;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.92);
            border: 2px dashed rgba(160, 104, 160, 0.45);
            text-align: center;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #42385d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to the Magical Spell Generator!</h1>
        
        <ul id="ingredientsList">
        <li>Dragon Scale</li>
        <li>Phoenix Feather</li>
        <li>Unicorn Horn</li></ul>
        
        <div class="buttons">
            <button id="generateButton">Generate Spell</button>
            <button id="resetButton">Reset</button>
        </div>

        <div id="spellArea">Click "Generate Spell" to begin your magic...</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
